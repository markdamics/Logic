server:
  port: 8080

app:
  auth:
    # Set to false to disable HTTP Basic auth entirely (e.g. behind your own
    # access control). Defaults to enabled - leave it on unless you know why not.
    enabled: ${AUTH_ENABLED:false}
  admin:
    # Credentials for the single HTTP Basic admin account (see SecurityConfig).
    # Override via ADMIN_USERNAME / ADMIN_PASSWORD env vars, or edit directly here.
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:}
  search:
    # Where the embedded Lucene search index lives on disk.
    index-dir: ${SEARCH_INDEX_DIR:./data/search-index}
    # How often (ms) enabled sources are re-scanned and reindexed in the background.
    index-interval-ms: ${SEARCH_INDEX_INTERVAL_MS:5000}
    # Max age (days) an indexed entry is kept before the retention sweep purges
    # it; 0 means unlimited (never purge), matching LogQueryParams.rangeMinutes'
    # existing "<=0 = unbounded" convention.
    retention-days: ${SEARCH_INDEX_RETENTION_DAYS:30}
    # How often (ms) the retention sweep runs.
    purge-interval-ms: ${SEARCH_INDEX_PURGE_INTERVAL_MS:3600000}
  alerts:
    # How often (ms) every alert rule is re-evaluated against the search index.
    evaluation-interval-ms: ${ALERT_EVALUATION_INTERVAL_MS:30000}
  logstream:
    # How often (ms) each open live-tail (SSE) connection is checked for new
    # matching entries. Independent of search.index-interval-ms - the SSE
    # poll can run tighter than the index refresh, but freshness is still
    # bounded by however often the index itself was last updated.
    sse-poll-interval-ms: ${LOGSTREAM_SSE_POLL_INTERVAL_MS:1000}
  apm:
    # Optional deep-link template for an external APM/tracing tool - {traceId}
    # is substituted with a correlated field's value (see LogStream's
    # Correlate button). Unset by default, so no "Open in APM" link renders
    # until this is configured. Example: https://app.datadoghq.com/apm/trace/{traceId}
    trace-url-template: ${APM_TRACE_URL_TEMPLATE:}
  uploads:
    # Where uploaded source files/directories (UPLOAD_FILE/UPLOAD_DIRECTORY) are stored on
    # disk after upload.
    dir: ${UPLOADS_DIR:./data/uploads}

spring:
  application:
    name: log-analyzer-backend
  servlet:
    multipart:
      # Caps on a single uploaded file / the whole multipart request for UPLOAD_FILE and
      # UPLOAD_DIRECTORY sources (a directory upload sends every file in one request).
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:100MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:500MB}
  datasource:
    url: jdbc:h2:file:./data/logsources;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      # Flyway (see below) owns schema changes now; Hibernate just validates
      # entity mappings still match what Flyway created.
      ddl-auto: validate
    open-in-view: false
  flyway:
    # Existing (pre-Flyway) databases already have the log_source table from
    # Hibernate's old ddl-auto=update - treat that as version 1 already
    # applied rather than trying to recreate it. Fresh databases have no
    # schema to baseline against, so V1__baseline.sql just runs normally.
    baseline-on-migrate: true
  h2:
    console:
      # Raw DB admin UI - stays behind auth when enabled, but off by default since
      # it's only meant for local debugging. Opt in with H2_CONSOLE_ENABLED=true.
      enabled: ${H2_CONSOLE_ENABLED:false}
      path: /h2-console
