server:
  port: 8080

spring:
  application:
    name: log-analyzer-backend
  datasource:
    url: jdbc:h2:file:./data/logsources;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
