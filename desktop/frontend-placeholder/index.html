<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Logic</title>
    <style>
      html, body {
        height: 100%;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0f1115;
        color: #d6d8dd;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .spinner {
        width: 28px;
        height: 28px;
        border: 3px solid #2a2d35;
        border-top-color: #6c8cff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-right: 12px;
      }
      .row { display: flex; align-items: center; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="row">
      <div class="spinner"></div>
      <span>Starting Logic…</span>
    </div>
  </body>
</html>
