  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

-weight: 400;\n  font-display: swap;\n  src: url(\"492ebc49-0239-4ebf-9ac0-7fec4a037e12\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Barlow Condensed';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"e9e188b4-338b-4d47-8d9e-f06e865b16ab\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Barlow Condensed';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"67dad454-e00e-433a-80f3-34c81592da16\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Barlow Condensed';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"7c0f15f0-ed80-4f69-916d-8e19d8f0ac29\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Barlow Condensed';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"891035b8-ccbc-45af-acc2-eb77c542be0d\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Barlow Condensed';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"807ca8dc-4f9a-439a-ada8-fea5e6403a1f\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f2f2f3;\n  --color-surface: #e9e9ea;\n  --color-text: #1d1f20;\n  --color-accent: #5980a6;\n  --color-accent-2: #728fab;\n  --color-divider: color-mix(in srgb, #1d1f20 16%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f5f5f8;\n  --color-neutral-200: #e7e7ea;\n  --color-neutral-300: #d4d4d7;\n  --color-neutral-400: #b7b7ba;\n  --color-neutral-500: #98989b;\n  --color-neutral-600: #7a7a7d;\n  --color-neutral-700: #5d5d60;\n  --color-neutral-800: #424244;\n  --color-neutral-900: #2b2b2d;\n\n  --color-accent-100: #eef6ff;\n  --color-accent-200: #d6ebff;\n  --color-accent-300: #b5d9fd;\n  --color-accent-400: #94bce3;\n  --color-accent-500: #749dc4;\n  --color-accent-600: #597ea3;\n  --color-accent-700: #416180;\n  --color-accent-800: #2c455d;\n  --color-accent-900: #1d2d3d;\n\n  --color-accent-2-100: #eef6ff;\n  --color-accent-2-200: #d6ebff;\n  --color-accent-2-300: #bdd8f2;\n  --color-accent-2-400: #9ebbd8;\n  --color-accent-2-500: #7e9cb8;\n  --color-accent-2-600: #627d98;\n  --color-accent-2-700: #486077;\n  --color-accent-2-800: #314457;\n  --color-accent-2-900: #1f2d3a;\n\n  --font-heading: \"Barlow Condensed\", system-ui, sans-serif;\n  --font-heading-weight: 600;\n  --font-body: \"Barlow\", system-ui, sans-serif;\n\n  --space-1: 3.4px;\n  --space-2: 6.8px;\n  --space-3: 10.2px;\n  --space-4: 13.6px;\n  --space-6: 20.4px;\n  --space-8: 27.2px;\n\n  --radius-sm: 2px;\n  --radius-md: 4px;\n  --radius-lg: 7px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2b2b2d 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2b2b2d 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2b2b2d 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.blueprint {\n  position: relative;\n  border: 1px solid var(--color-divider);\n  border-radius: 0;\n}\n/* The overlay image treatments (halftone, duotone) clip their overlay\n   (overflow:hidden); a blueprint wrapper draws its registration marks\n   outside the box, so when both classes share a wrapper the frame must\n   win. */\n.blueprint.halftone, .blueprint.plate, .blueprint.duotone { overflow: visible; }\n.blueprint > .corner {\n  position: absolute; width: 11px; height: 11px;\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.blueprint > .corner::before, .blueprint > .corner::after {\n  content: \"\"; position: absolute; background: currentColor;\n}\n.blueprint > .corner::before { left: 5px; top: 0; width: 1px; height: 100%; }\n.blueprint > .corner::after  { top: 5px; left: 0; width: 100%; height: 1px; }\n.blueprint > .corner.tl { top: -6px; left: -6px; }\n.blueprint > .corner.tr { top: -6px; right: -6px; }\n.blueprint > .corner.bl { bottom: -6px; left: -6px; }\n.blueprint > .corner.br { bottom: -6px; right: -6px; }\n\n.duotone{position:relative;overflow:hidden}\n.duotone::after{content:\"\";position:absolute;inset:0;pointer-events:none;\n  background:var(--color-accent);mix-blend-mode:color}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* — blueprint frame: components are wireframe objects (see .blueprint\n     and .corner above) — square, transparent, hairline-bordered — */\n.card, .btn, .input, .tag, .seg, .dialog { border-radius: 0; }\n.card, .dialog { background: transparent; border: 1px solid var(--color-divider); }\n.btn { border: 1px solid var(--color-divider); }\n.btn-primary { border-color: var(--color-accent); }\n.btn-ghost { border-color: transparent; }\n\n<\u002Fstyle>\n<script src=\"bc5a3dec-3311-4e8f-8128-716303bc37e7\"><\u002Fscript>\n<meta name=\"design_doc_mode\" content=\"canvas\">\n<style>\nbody{margin:0;background:#f0eee9;font-family:system-ui,sans-serif}\n.dv-turn{padding:40px 44px 32px}\n.dv-thd{display:flex;align-items:baseline;gap:10px;margin:0 0 20px}\n.dv-tid{font:600 10px ui-monospace,Menlo,monospace;padding:3px 7px;background:#1a1a1a;color:#fff;border-radius:4px;text-decoration:none}\n.dv-tname{font:600 13px/1.2 system-ui,sans-serif;color:#1a1a1a}\n.dv-opts{display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start}\n.dv-opt{flex:none;display:flex;flex-direction:column;gap:9px;scroll-margin-top:16px}\n.dv-oid{font:600 10.5px ui-monospace,Menlo,monospace;padding:3px 7px;background:rgba(0,0,0,.08);color:#1a1a1a;border-radius:5px;text-decoration:none}\n.dv-olabel{display:flex;align-items:baseline;gap:8px;font:400 11px/1.3 system-ui,sans-serif;color:rgba(0,0,0,.55)}\n.dv-card{max-width:100%}\n.dv-next{margin:22px 0 0;font:12px/1.5 system-ui,sans-serif;color:rgba(0,0,0,.5)}\n.la-nav-item{cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 12px;font-family:var(--font-heading);font-weight:600;font-size:14px}\n.la-icon{display:block;flex:none}\n.la-fcell{padding:10px 16px;border-left:1px solid var(--color-divider);display:flex;flex-direction:column;gap:4px;justify-content:center}\n.la-fcell:first-child{border-left:none}\n<\u002Fstyle>\n<\u002Fhelmet>\n<section class=\"dv-turn\" id=\"t2\">\n<div class=\"dv-thd\"><a class=\"dv-tid\" href=\"#t2\">2<\u002Fa><span class=\"dv-tname\">Combining <a class=\"dv-oid\" href=\"#1a\">1a<\u002Fa>'s sidebar with <a class=\"dv-oid\" href=\"#1b\">1b<\u002Fa>'s dense table, plus saved presets and an alerts screen<\u002Fspan><\u002Fdiv>\n<div class=\"dv-opts\">\n\n<div class=\"dv-opt\" id=\"2a\">\n<div class=\"dv-olabel\"><a class=\"dv-oid\" href=\"#2a\">2a<\u002Fa>Sidebar + dense table + presets + Alerts screen<\u002Fdiv>\n<div class=\"dv-card blueprint\" style=\"{{ cFrameVars }}width:1440px;height:900px;border:1px solid var(--color-divider);box-shadow:var(--shadow-lg);background:var(--color-bg);display:flex;overflow:hidden;position:relative;color:var(--color-text);transition:background .15s,color .15s\">\n<i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n\n<div style=\"width:{{ cSidebarWidth }};flex:none;border-right:1px solid var(--color-divider);display:flex;flex-direction:column;padding:var(--space-4) var(--space-3);gap:var(--space-6);transition:width .15s;overflow:hidden\">\n  <div style=\"display:flex;align-items:center;gap:8px;font-family:var(--font-heading);font-weight:600;font-size:19px;letter-spacing:-0.01em;padding:0 4px\">\n    <svg class=\"la-icon\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"16\" rx=\"0\"><\u002Frect><path d=\"M7 9l3 3-3 3\"><\u002Fpath><line x1=\"12\" y1=\"15\" x2=\"16\" y2=\"15\"><\u002Fline><\u002Fsvg>\n    <span style=\"{{ cSidebarLabelStyle }};white-space:nowrap\">LOGSCOPE<\u002Fspan>\n    <button class=\"btn btn-icon btn-ghost\" sc-camel-on-click=\"{{ cToggleSidebar }}\" title=\"Collapse sidebar\" style=\"width:24px;height:24px;margin-left:auto\">\n      <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"16\"><\u002Frect><line x1=\"10\" y1=\"4\" x2=\"10\" y2=\"20\"><\u002Fline><\u002Fsvg>\n    <\u002Fbutton>\n  <\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:2px\">\n    <div class=\"la-nav-item\" sc-camel-on-click=\"{{ cGoDashboard }}\" style=\"{{ cNavDashboardStyle }}{{ cSidebarNavJustify }}\">\n      <svg class=\"la-icon\" width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"9\"><\u002Frect><rect x=\"14\" y=\"3\" width=\"7\" height=\"5\"><\u002Frect><rect x=\"14\" y=\"12\" width=\"7\" height=\"9\"><\u002Frect><rect x=\"3\" y=\"16\" width=\"7\" height=\"5\"><\u002Frect><\u002Fsvg>\n      <span style=\"{{ cSidebarLabelStyle }};white-space:nowrap\">Dashboard<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"la-nav-item\" sc-camel-on-click=\"{{ cGoLogs }}\" style=\"{{ cNavLogsStyle }}{{ cSidebarNavJustify }}\">\n      <svg class=\"la-icon\" width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"><line x1=\"4\" y1=\"6\" x2=\"20\" y2=\"6\"><\u002Fline><line x1=\"4\" y1=\"12\" x2=\"20\" y2=\"12\"><\u002Fline><line x1=\"4\" y1=\"18\" x2=\"14\" y2=\"18\"><\u002Fline><\u002Fsvg>\n      <span style=\"{{ cSidebarLabelStyle }};white-space:nowrap\">Log Stream<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"la-nav-item\" sc-camel-on-click=\"{{ cGoSources }}\" style=\"{{ cNavSourcesStyle }}{{ cSidebarNavJustify }}\">\n      <svg class=\"la-icon\" width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"><ellipse cx=\"12\" cy=\"6\" rx=\"8\" ry=\"3\"><\u002Fellipse><path d=\"M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6\"><\u002Fpath><path d=\"M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6\"><\u002Fpath><\u002Fsvg>\n      <span style=\"{{ cSidebarLabelStyle }};white-space:nowrap\">Sources<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"la-nav-item\" sc-camel-on-click=\"{{ cGoAlerts }}\" style=\"{{ cNavAlertsStyle }}{{ cSidebarNavJustify }}\">\n      <svg class=\"la-icon\" width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"><path d=\"M6 8a6 6 0 1112 0c0 4 1.5 5 1.5 6.5H4.5C4.5 13 6 12 6 8z\"><\u002Fpath><path d=\"M9.5 17a2.5 2.5 0 005 0\"><\u002Fpath><\u002Fsvg>\n      <span style=\"{{ cSidebarLabelStyle }};white-space:nowrap\">Alerts<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"flex:1\"><\u002Fdiv>\n  <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ cToggleDark }}\" style=\"justify-content:flex-start;gap:8px\">\n    <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" stroke=\"currentColor\" stroke-width=\"1.5\" fill=\"none\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 3a9 9 0 010 18z\" fill=\"currentColor\" stroke=\"none\"><\u002Fpath><\u002Fsvg>\n    <span style=\"{{ cSidebarLabelStyle }};white-space:nowrap\">{{ cDarkLabel }}<\u002Fspan>\n  <\u002Fbutton>\n<\u002Fdiv>\n\n<div style=\"flex:1;display:flex;flex-direction:column;min-width:0\">\n  <div style=\"padding:var(--space-4) var(--space-6);border-bottom:1px solid var(--color-divider);display:flex;align-items:center;justify-content:space-between\">\n    <h3 style=\"margin:0;white-space:nowrap\">{{ cTitle }}<\u002Fh3>\n    <sc-if value=\"{{ cOnLogs }}\" hint-placeholder-val=\"{{ true }}\">\n      <span class=\"text-muted\" style=\"font-size:12.5px\">{{ cRowCount }} results<\u002Fspan>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ cOnLogs }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3) var(--space-6);border-bottom:1px solid var(--color-divider);flex-wrap:wrap\">\n      <input class=\"input\" style=\"width:230px\" placeholder=\"Search logs…\" value=\"{{ cSearch }}\" sc-camel-on-change=\"{{ cSetSearch }}\">\n      <sc-raw-select class=\"input\" style=\"width:150px\" value=\"{{ cSourceValue }}\" sc-camel-on-change=\"{{ cSetSource }}\">\n        <option value=\"\">All sources<\u002Foption>\n        <option value=\"api-gateway\">api-gateway<\u002Foption>\n        <option value=\"auth-service\">auth-service<\u002Foption>\n        <option value=\"payment-worker\">payment-worker<\u002Foption>\n        <option value=\"checkout-api\">checkout-api<\u002Foption>\n        <option value=\"db-proxy\">db-proxy<\u002Foption>\n        <option value=\"notifications-service\">notifications-service<\u002Foption>\n      <\u002Fsc-raw-select>\n      <div style=\"display:flex;gap:6px;margin-left:auto\">\n        <sc-for list=\"{{ cChips }}\" as=\"c\" hint-placeholder-count=\"4\">\n          <button sc-camel-on-click=\"{{ c.onClick }}\" style=\"{{ c.style }} border:1px solid var(--color-divider);border-radius:var(--radius-md);padding:6px 12px;font-family:var(--font-heading);font-weight:600;font-size:12.5px;cursor:pointer\">{{ c.level }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:8px;padding:var(--space-2) var(--space-6);border-bottom:1px solid var(--color-divider);background:color-mix(in srgb, var(--color-text) 3%, transparent)\">\n      <span class=\"text-muted\" style=\"font-size:11px;text-transform:uppercase;letter-spacing:.08em\">Presets<\u002Fspan>\n      <sc-for list=\"{{ cPresets }}\" as=\"p\" hint-placeholder-count=\"4\">\n        <button class=\"tag tag-outline\" sc-camel-on-click=\"{{ p.onClick }}\" style=\"cursor:pointer;font-size:11.5px;white-space:nowrap\">{{ p.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div style=\"flex:1;overflow:auto;padding:var(--space-6)\">\n    <sc-if value=\"{{ cOnLogs }}\" hint-placeholder-val=\"{{ true }}\">\n      <sc-raw-table class=\"table\" style=\"font-size:13px\">\n        <sc-raw-thead><sc-raw-tr>\n          <sc-raw-th sc-camel-on-click=\"{{ cSortByTime }}\" style=\"cursor:pointer;width:110px;padding:6px 8px\">Time {{ cSortTimeArrow }}<\u002Fsc-raw-th>\n          <sc-raw-th sc-camel-on-click=\"{{ cSortByLevel }}\" style=\"cursor:pointer;width:90px;padding:6px 8px\">Level {{ cSortLevelArrow }}<\u002Fsc-raw-th>\n          <sc-raw-th sc-camel-on-click=\"{{ cSortBySource }}\" style=\"cursor:pointer;width:160px;padding:6px 8px\">Source {{ cSortSourceArrow }}<\u002Fsc-raw-th>\n          <sc-raw-th style=\"padding:6px 8px\">Message<\u002Fsc-raw-th>\n        <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n        <sc-raw-tbody>\n          <sc-for list=\"{{ cRows }}\" as=\"row\" hint-placeholder-count=\"10\">\n            <sc-raw-tr sc-camel-on-click=\"{{ row.onClick }}\" style=\"cursor:pointer\">\n              <sc-raw-td class=\"text-muted\" style=\"font-family:ui-monospace,monospace;font-size:12px;padding:4px 8px\">{{ row.ts }}<\u002Fsc-raw-td>\n              <sc-raw-td style=\"padding:4px 8px\"><span class=\"{{ row.tagCls }}\" style=\"{{ row.tagStyle }}\">{{ row.level }}<\u002Fspan><\u002Fsc-raw-td>\n              <sc-raw-td style=\"padding:4px 8px\">{{ row.source }}<\u002Fsc-raw-td>\n              <sc-raw-td style=\"padding:4px 8px;font-family:ui-monospace,monospace\">{{ row.message }}<\u002Fsc-raw-td>\n            <\u002Fsc-raw-tr>\n          <\u002Fsc-for>\n        <\u002Fsc-raw-tbody>\n      <\u002Fsc-raw-table>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ cOnSources }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-4)\">\n        <sc-for list=\"{{ cSources }}\" as=\"s\" hint-placeholder-count=\"8\">\n          <div class=\"card blueprint\" style=\"position:relative;padding:var(--space-4)\">\n            <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n            <div style=\"position:absolute;top:8px;right:8px;display:flex;gap:2px\">\n              <button class=\"btn btn-icon btn-ghost\" sc-camel-on-click=\"{{ s.onEdit }}\" title=\"Edit\" style=\"width:26px;height:26px\"><svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"><path d=\"M12 20h9\"><\u002Fpath><path d=\"M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n              <button class=\"btn btn-icon btn-ghost\" sc-camel-on-click=\"{{ s.onDelete }}\" title=\"Delete\" style=\"width:26px;height:26px\"><svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"><path d=\"M4 7h16\"><\u002Fpath><path d=\"M6 7l1 13a1 1 0 001 1h8a1 1 0 001-1l1-13\"><\u002Fpath><path d=\"M9 7V4a1 1 0 011-1h4a1 1 0 011 1v3\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n            <\u002Fdiv>\n            <div class=\"card-kicker\">{{ s.type }}<\u002Fdiv>\n            <div class=\"card-title\">{{ s.name }}<\u002Fdiv>\n            <div class=\"card-body\">{{ s.lines }} · {{ s.size }}<div class=\"text-muted\" style=\"font-size:11.5px;margin-top:2px\">{{ s.location }}<\u002Fdiv><\u002Fdiv>\n            <div class=\"card-meta\"><span class=\"{{ s.statusCls }}\" style=\"{{ s.statusStyle }}\">{{ s.status }}<\u002Fspan><span>Updated {{ s.updated }}<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <div class=\"card blueprint\" style=\"position:relative;padding:var(--space-4);align-items:center;justify-content:center;border-style:dashed;gap:var(--space-2)\">\n          <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n          <svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--color-accent)\" stroke-width=\"1.5\"><path d=\"M12 16V4\"><\u002Fpath><path d=\"M6 10l6-6 6 6\"><\u002Fpath><path d=\"M4 20h16\"><\u002Fpath><\u002Fsvg>\n          <button class=\"btn btn-secondary\">Add source<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ cOnAlerts }}\" hint-placeholder-val=\"{{ false }}\">\n      <sc-raw-table class=\"table\" style=\"font-size:13px\">\n        <sc-raw-thead><sc-raw-tr>\n          <sc-raw-th style=\"padding:6px 8px\">Alert<\u002Fsc-raw-th>\n          <sc-raw-th style=\"padding:6px 8px\">Scope<\u002Fsc-raw- ly:var(--font-heading)\">{{ ins.source }}<\u002Fstrong> — {{ ins.text }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ bOnLogs }}\" hint-placeholder-val=\"{{ true }}\">\n    <sc-raw-table class=\"table\" style=\"font-size:13px\">\n      <sc-raw-thead><sc-raw-tr>\n        <sc-raw-th sc-camel-on-click=\"{{ bSortByTime }}\" style=\"cursor:pointer;width:110px;padding:6px 8px\">Time {{ bSortTimeArrow }}<\u002Fsc-raw-th>\n        <sc-raw-th sc-camel-on-click=\"{{ bSortByLevel }}\" style=\"cursor:pointer;width:90px;padding:6px 8px\">Level {{ bSortLevelArrow }}<\u002Fsc-raw-th>\n        <sc-raw-th sc-camel-on-click=\"{{ bSortBySource }}\" style=\"cursor:pointer;width:160px;padding:6px 8px\">Source {{ bSortSourceArrow }}<\u002Fsc-raw-th>\n        <sc-raw-th style=\"padding:6px 8px\">Message<\u002Fsc-raw-th>\n      <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n      <sc-raw-tbody>\n        <sc-for list=\"{{ bRows }}\" as=\"row\" hint-placeholder-count=\"10\">\n          <sc-raw-tr sc-camel-on-click=\"{{ row.onClick }}\" style=\"cursor:pointer\">\n            <sc-raw-td class=\"text-muted\" style=\"font-family:ui-monospace,monospace;font-size:12px;padding:4px 8px\">{{ row.ts }}<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:4px 8px\"><span class=\"{{ row.tagCls }}\" style=\"{{ row.tagStyle }}\">{{ row.level }}<\u002Fspan><\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:4px 8px\">{{ row.source }}<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:4px 8px;font-family:ui-monospace,monospace\">{{ row.message }}<\u002Fsc-raw-td>\n          <\u002Fsc-raw-tr>\n        <\u002Fsc-for>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ bOnSources }}\" hint-placeholder-val=\"{{ false }}\">\n    <sc-raw-table class=\"table\">\n      <sc-raw-thead><sc-raw-tr><sc-raw-th>Name<\u002Fsc-raw-th><sc-raw-th>Type<\u002Fsc-raw-th><sc-raw-th>Location<\u002Fsc-raw-th><sc-raw-th>Size<\u002Fsc-raw-th><sc-raw-th>Lines<\u002Fsc-raw-th><sc-raw-th>Status<\u002Fsc-raw-th><sc-raw-th>Updated<\u002Fsc-raw-th><sc-raw-th><\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n      <sc-raw-tbody>\n        <sc-for list=\"{{ bSources }}\" as=\"s\" hint-placeholder-count=\"8\">\n          <sc-raw-tr>\n            <sc-raw-td style=\"font-family:var(--font-heading);font-weight:600\">{{ s.name }}<\u002Fsc-raw-td>\n            <sc-raw-td class=\"text-muted\">{{ s.type }}<\u002Fsc-raw-td>\n            <sc-raw-td class=\"text-muted\" style=\"font-family:ui-monospace,monospace;font-size:12.5px\">{{ s.location }}<\u002Fsc-raw-td>\n            <sc-raw-td>{{ s.size }}<\u002Fsc-raw-td>\n            <sc-raw-td>{{ s.lines }}<\u002Fsc-raw-td>\n            <sc-raw-td><span class=\"{{ s.statusCls }}\" style=\"{{ s.statusStyle }}\">{{ s.status }}<\u002Fspan><\u002Fsc-raw-td>\n            <sc-raw-td class=\"text-muted\">{{ s.updated }}<\u002Fsc-raw-td>\n            <sc-raw-td style=\"white-space:nowrap\"><button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ s.onEdit }}\" style=\"padding:2px 6px;font-size:12px\">Edit<\u002Fbutton><button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ s.onDelete }}\" style=\"padding:2px 6px;font-size:12px\">Delete<\u002Fbutton><\u002Fsc-raw-td>\n          <\u002Fsc-raw-tr>\n        <\u002Fsc-for>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n    <button class=\"btn btn-secondary\" style=\"margin-top:var(--space-4)\">+ Add source<\u002Fbutton>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ bEditOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div class=\"dialog-backdrop\" style=\"position:absolute\">\n      <div class=\"dialog\">\n        <div class=\"dialog-title\">Edit source<\u002Fdiv>\n        <div class=\"dialog-body\" style=\"display:flex;flex-direction:column;gap:var(--space-3)\">\n          <div class=\"field\"><label>Name / path<\u002Flabel><input class=\"input\" value=\"{{ bEditName }}\" sc-camel-on-change=\"{{ bEditSetName }}\"><\u002Fdiv>\n          <div class=\"field\"><label>Location<\u002Flabel><input class=\"input\" value=\"{{ bEditLocation }}\" sc-camel-on-change=\"{{ bEditSetLocation }}\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"dialog-actions\">\n          <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ bEditCancel }}\">Cancel<\u002Fbutton>\n          <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ bEditSave }}\">Save<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ bOnDetail }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"max-width:820px\">\n      <div class=\"text-muted\" style=\"font-size:12.5px;margin-bottom:var(--space-3)\"><a sc-camel-on-click=\"{{ bBack }}\" style=\"cursor:pointer;color:var(--color-accent)\">Log Stream<\u002Fa> / {{ bDetail.source }} / {{ bDetail.id }}<\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:var(--space-3)\">\n        <span class=\"{{ bDetail.tagCls }}\" style=\"{{ bDetail.tagStyle }}\">{{ bDetail.level }}<\u002Fspan>\n        <span class=\"text-muted\" style=\"font-size:13px;font-family:ui-monospace,monospace\">{{ bDetail.ts }}<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"font-size:16px;line-height:1.5;font-family:ui-monospace,monospace\">{{ bDetail.message }}<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:140px 1fr 140px 1fr;gap:var(--space-2) var(--space-4);font-size:13px;padding:var(--space-4) 0;border-top:1px solid var(--color-divider);border-bottom:1px solid var(--color-divider)\">\n        <div class=\"text-muted\">Request ID<\u002Fdiv><div style=\"font-family:ui-monospace,monospace\">{{ bDetail.reqId }}<\u002Fdiv>\n        <div class=\"text-muted\">Host<\u002Fdiv><div style=\"font-family:ui-monospace,monospace\">{{ bDetail.host }}<\u002Fdiv>\n        <div class=\"text-muted\">Pod<\u002Fdiv><div style=\"font-family:ui-monospace,monospace\">{{ bDetail.pod }}<\u002Fdiv>\n        <div class=\"text-muted\">User<\u002Fdiv><div style=\"font-family:ui-monospace,monospace\">{{ bDetail.userId }}<\u002Fdiv>\n        <div class=\"text-muted\">Duration<\u002Fdiv><div style=\"font-family:ui-monospace,monospace\">{{ bDetail.duration }}<\u002Fdiv>\n        <div class=\"text-muted\">Trace ID<\u002Fdiv><div style=\"font-family:ui-monospace,monospace\">{{ bDetail.traceId }}<\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{ bDetail.hasStack }}\" hint-placeholder-val=\"{{ false }}\">\n        <div class=\"blueprint\" style=\"position:relative;font-family:ui-monospace,monospace;font-size:12.5px;white-space:pre-wrap;padding:var(--space-4);margin-top:var(--space-4)\">\n          <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n          {{ bDetail.stack }}\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <h6 style=\"margin-top:var(--space-6)\">Related logs<\u002Fh6>\n      <sc-for list=\"{{ bRelated }}\" as=\"r\" hint-placeholder-count=\"2\">\n        <div sc-camel-on-click=\"{{ r.onClick }}\" style=\"cursor:pointer;padding:8px 0;border-bottom:1px solid var(--color-divider);font-size:13px;display:flex;gap:10px;font-family:ui-monospace,monospace\">\n          <span class=\"text-muted\">{{ r.ts }}<\u002Fspan><span>{{ r.message }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<p class=\"dv-next\">Try next: \"combine <a class=\"dv-oid\" href=\"#1a\">1a<\u002Fa>'s sidebar with <a class=\"dv-oid\" href=\"#1b\">1b<\u002Fa>'s dense table\" · \"add a saved-filter presets bar\" · \"show an alerting screen\"<\u002Fp>\n<\u002Fsection>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.rawSources = [\n      {id:1,name:'api-gateway.log',kind:'file',location:'localhost',type:'Uploaded file',size:'842 MB',lines:'1,204,588 lines',status:'Synced',updated:'2m ago'},\n      {id:2,name:'auth-service.log',kind:'file',location:'localhost',type:'Uploaded file',size:'156 MB',lines:'312,004 lines',status:'Synced',updated:'12m ago'},\n      {id:3,name:'payment-worker',kind:'agent',location:'10.2.4.31:9000',type:'Live agent',size:'—',lines:'48,290 lines today',status:'Connected',updated:'live'},\n      {id:4,name:'checkout-api.log',kind:'file',location:'localhost',type:'Uploaded file',size:'22 MB',lines:'41,880 lines',status:'Parsing',updated:'1m ago'},\n      {id:5,name:'/var/log/worker-queue/',kind:'directory',location:'10.4.2.11 (ssh)',type:'Directory',size:'214 MB',lines:'12 files',status:'Synced',updated:'34m ago'},\n      {id:6,name:'notifications-service',kind:'agent',location:'notify-prod-2.internal:9000',type:'Live agent',size:'—',lines:'6,732 lines today',status:'Connected',updated:'live'},\n      {id:7,name:'legacy-billing.log',kind:'file',location:'localhost',type:'Uploaded file',size:'1.1 GB',lines:'—',status:'Error',updated:'3h ago'},\n      {id:8,name:'/data/logs/db-proxy/',kind:'directory',location:'10.4.2.18 (nfs)',type:'Directory',size:'640 MB',lines:'34 files',status:'Synced',updated:'8m ago'},\n    ];\n    this.rawAlerts = [\n      {id:1,name:'Error rate > 1%',scope:'All sources',condition:'Triggers when error rate exceeds 1% over 5 min',status:'Active',lastTriggered:'—'},\n      {id:2,name:'payment-worker error spike',scope:'payment-worker',condition:'5+ errors in 10 min',status:'Triggered',lastTriggered:'2 min ago'},\n      {id:3,name:'auth-service timeout burst',scope:'auth-service',condition:'3+ timeouts in 15 min',status:'Active',lastTriggered:'1h ago'},\n      {id:4,name:'notifications webhook failures',scope:'notifications-service',condition:'Webhook 5xx > 5 in 30 min',status:'Muted',lastTriggered:'3h ago'},\n      {id:5,name:'Source disconnected',scope:'All sources',condition:'No data received for 10 min',status:'Active',lastTriggered:'—'},\n    ];\n    this.presets = [\n      {id:'all-errors', label:'All errors', sev:['ERROR'], source:'', search:''},\n      {id:'payment', label:'Payment issues', sev:[], source:'payment-worker', search:''},\n      {id:'auth-timeouts', label:'Auth timeouts', sev:[], source:'auth-service', search:'timeout'},\n      {id:'clear', label:'Clear filters', sev:[], source:'', search:''},\n    ];\n\n    const raw = [\n      {id:1,t:1400,ts:'08:42:13.204',level:'ERROR',source:'payment-worker',message:'Unhandled exception in handler: NullReferenceException at ChargeProcessor.Execute'},\n      {id:2,t:1390,ts:'08:42:12.918',level:'INFO',source:'api-gateway',message:'Request completed — POST /v1/checkout/session 201 118ms'},\n      {id:3,t:1380,ts:'08:42:12.501',level:'WARN',source:'api-gateway',message:'Rate limit exceeded for client 10.2.4.18 (429)'},\n      {id:4,t:1370,ts:'08:42:11.887',level:'ERROR',source:'auth-service',message:'Connection to database timed out after 30000ms'},\n      {id:5,t:1360,ts:'08:42:11.320',level:'DEBUG',source:'auth-service',message:'Cache miss for key session:88213f'},\n      {id:6,t:1350,ts:'08:42:10.994',level:'INFO',source:'payment-worker',message:'Payment authorization succeeded — order #48213'},\n      {id:7,t:1340,ts:'08:42:10.442',level:'WARN',source:'checkout-api',message:'Retrying failed job (attempt 3/5) — queue:checkout-emails'},\n      {id:8,t:1330,ts:'08:42:09.771',level:'INFO',source:'db-proxy',message:'Query executed — SELECT * FROM orders WHERE status = ? (14ms)'},\n      {id:9,t:1320,ts:'08:42:09.203',level:'ERROR',source:'notifications-service',message:'Failed to deliver webhook to https://hooks.merchant.io/order — 503'},\n      {id:10,t:1310,ts:'08:42:08.650',level:'INFO',source:'auth-service',message:'User authenticated — user_id=88213'},\n      {id:11,t:1300,ts:'08:42:08.104',level:'WARN',source:'db-proxy',message:'Slow query detected — 1,204ms — SELECT * FROM line_items'},\n      {id:12,t:1290,ts:'08:42:07.588',level:'DEBUG',source:'payment-worker',message:'Dequeued job charge.create — attempt 1'},\n      {id:13,t:1280,ts:'08:42:07.022',level:'INFO',source:'checkout-api',message:'Session created — cart_id=9931'},\n      {id:14,t:1270,ts:'08:42:06.410',level:'ERROR',source:'api-gateway',message:'Upstream service unavailable — payment-worker returned 502'},\n    ];\n    const stacks = {\n      1: \"System.NullReferenceException: Object reference not set to an instance of an object.\\n   at ChargeProcessor.Execute(OrderContext ctx) line 214\\n   at PaymentWorker.Handlers.ChargeHandler.Handle(ChargeCreated evt) line 58\\n   at PaymentWorker.Queue.Consumer.Process(Message msg) line 91\",\n      4: \"Npgsql.NpgsqlException: Exception while connecting\\n   at AuthService.Data.SessionStore.GetSession(Guid id) line 132\\n   at AuthService.Middleware.SessionMiddleware.Invoke(HttpContext ctx) line 44\",\n      9: \"System.Net.Http.HttpRequestException: Response status code does not indicate success: 503\\n   at NotificationsService.Webhooks.WebhookSender.SendAsync(Uri endpoint, Payload p) line 77\\n   at NotificationsService.Jobs.DeliveryJob.Run() line 29\",\n      14: \"System.Net.Http.HttpRequestException: 502 Bad Gateway from upstream 'payment-worker'\\n   at ApiGateway.Proxy.UpstreamClient.Forward(HttpRequest req) line 65\\n   at ApiGateway.Middleware.ProxyMiddleware.Invoke(HttpContext ctx) line 38\",\n    };\n    this.logs = raw.map(l => ({\n      ...l,\n      reqId: 'req_' + (100000 + l.id * 137).toString(16),\n      host: 'ip-10-2-' + (l.id % 4) + '-' + (40 + l.id),\n      pod: l.source + '-' + (7000 + l.id * 91).toString(36) + '-x' + l.id + 'k4p',\n      userId: l.level === 'DEBUG' ? '—' : 'user_' + (88200 + l.id),\n      duration: (40 + l.id * 17) + 'ms',\n      traceId: (9000000000 + l.id * 137).toString(16),\n      stack: stacks[l.id] || null,\n    }));\n    this.insights = [\n      { count: '58 in 24h', source: 'payment-worker', text: \
